name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "refactor/**", "test/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  # Falha primeiro. Economiza tempo dos jobs seguintes.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint (G-01) — BLOQUEANTE
        run: ruff check .

      - name: Ruff format check (G-02)
        # TEMPORÁRIO — remover na Sprint 3 após commit chore(style): aplicar formatação
        run: ruff format --check .
        continue-on-error: true

      - name: isort check
        # TEMPORÁRIO — remover na Sprint 3 após commit chore(style): aplicar formatação
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Black format check
        # TEMPORÁRIO — remover na Sprint 3 após commit chore(style): aplicar formatação
        run: black --check .
        continue-on-error: true

  # ── 2. Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (G-04)
        run: pytest tests/ --tb=short

  # ── 3. Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint (G-03)
        run: npm run lint
        working-directory: frontend

  # ── 4. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build (G-06)
        run: npm run build
        working-directory: frontend

  # ── 5. Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Coverage (G-05) — BLOQUEANTE (threshold 40%, ver pyproject.toml)
        run: pytest tests/ --cov --cov-report=term-missing --cov-fail-under=40
