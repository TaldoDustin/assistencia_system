# Cadência de sync do app "Lista de Aparelhos Disponíveis" (apps/lista-aparelhos-disponiveis).
#
# Necessário porque o projeto está no Vercel Hobby, cujo cron roda no máximo 1x/dia
# (o vercel.json tem um cron diário só como rede de segurança). Aqui é a cadência real.
#
# Só roda depois que a variável de repositório ESTOQUE_SYNC_URL estiver configurada
# (Settings → Secrets and variables → Actions → Variables) e o secret ESTOQUE_SYNC_SECRET
# estiver criado (= o SYNC_SECRET do projeto Vercel). Enquanto não estiverem, o job é pulado.
name: Estoque — sync MercadoPhone

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: estoque-sync
  cancel-in-progress: false

jobs:
  sync:
    name: POST /api/sync
    runs-on: ubuntu-latest
    if: ${{ vars.ESTOQUE_SYNC_URL != '' }}
    steps:
      - name: Disparar sync
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "${{ vars.ESTOQUE_SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.ESTOQUE_SYNC_SECRET }}")
          echo "HTTP $code"
          cat /tmp/out.json
          test "$code" = "200"
