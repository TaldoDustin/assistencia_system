<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Estoque — IR Phones</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Tela de bloqueio -->
  <div id="lock" class="lock">
    <div class="lock-card">
      <div class="lock-brand">IR&nbsp;Phones</div>
      <div class="lock-sub">Estoque de aparelhos</div>
      <form id="lockForm" autocomplete="off">
        <input
          id="senha"
          type="password"
          inputmode="numeric"
          placeholder="Senha de acesso"
          aria-label="Senha de acesso"
          autocomplete="off"
        />
        <button type="submit" id="lockBtn">Desbloquear</button>
        <p id="lockErr" class="lock-err" hidden></p>
      </form>
    </div>
    <p class="lock-foot">Ferramenta interna · uso restrito à equipe</p>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <strong>IR Phones</strong>
        <span id="metaStamp">—</span>
      </div>
      <div class="search">
        <input id="busca" type="search" placeholder="Buscar modelo, cor, ID…" autocomplete="off" />
        <button class="btn" id="btnAtualizar" type="button">Atualizar</button>
        <button class="btn ghost" id="btnExcel" type="button">Excel</button>
        <button class="btn ghost" id="btnSair" type="button">Sair</button>
      </div>
    </header>

    <main class="main">
      <div class="filtros">
        <label>Tipo
          <select id="fTipo"><option value="">Todos</option></select>
        </label>
        <label>Estado
          <select id="fEstado"><option value="">Todos</option></select>
        </label>
        <label>Armazenamento
          <select id="fArmazenamento"><option value="">Todos</option></select>
        </label>
        <span class="tabs" id="tabs" hidden>
          <button class="tab is-active" data-tab="disponiveis" type="button">Disponíveis</button>
          <button class="tab" data-tab="reservados" type="button">Reservados</button>
        </span>
      </div>

      <section class="kpis">
        <div class="kpi"><span class="k-lab">Aparelhos</span><span class="k-val" id="kTotal">0</span></div>
        <div class="kpi"><span class="k-lab">Exibindo</span><span class="k-val" id="kVisiveis">0</span></div>
        <div class="kpi" id="kValorWrap" hidden><span class="k-lab">Valor em estoque</span><span class="k-val" id="kValor">—</span></div>
      </section>

      <div id="statusMsg" class="status"></div>
      <div id="grupos" class="grupos"></div>
    </main>
  </div>

  <!-- Modal de reserva -->
  <dialog id="dlgReserva">
    <form method="dialog">
      <h3>Reservar unidade</h3>
      <p id="dlgResumo" class="dlg-resumo"></p>
      <label>Vendedor
        <input id="dlgVendedor" type="text" maxlength="60" autocomplete="off" required />
      </label>
      <div class="dlg-acoes">
        <button value="cancel" class="btn ghost">Cancelar</button>
        <button value="ok" id="dlgConfirmar" class="btn">Reservar</button>
      </div>
    </form>
  </dialog>

  <script src="/xlsx.js"></script>
  <script src="/app.js"></script>
</body>
</html>
