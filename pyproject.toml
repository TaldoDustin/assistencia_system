[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "build_exe.ps1",
    "build_setup.ps1",
    "scripts/",
    "assets/",
    "frontend/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line too long — Black handles length
    "UP007",  # use X | Y for union — Python 3.9 compat in some contexts
]

[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
    \.git
  | frontend
  | scripts
  | assets
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = [
    "app",
    "irflow_blueprints_admin",
    "irflow_blueprints_api",
    "irflow_blueprints_auth",
    "irflow_blueprints_inventory",
    "irflow_blueprints_main",
    "irflow_blueprints_orders",
    "irflow_core",
    "irflow_mercadophone",
    "irflow_os",
    "irflow_price_tables",
    "irflow_reference_data",
    "irflow_reports",
    "irflow_storage",
    "irflow_validation",
    "irflow_web",
]
skip_glob = ["frontend/*", "scripts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-ra",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = [
    "app",
    "irflow_blueprints_admin",
    "irflow_blueprints_api",
    "irflow_blueprints_auth",
    "irflow_blueprints_inventory",
    "irflow_blueprints_main",
    "irflow_blueprints_orders",
    "irflow_core",
    "irflow_mercadophone",
    "irflow_os",
    "irflow_price_tables",
    "irflow_reference_data",
    "irflow_reports",
    "irflow_storage",
    "irflow_validation",
    "irflow_web",
]
omit = [
    "tests/*",
    "scripts/*",
    "*.ps1",
]

[tool.coverage.report]
show_missing = true
# Threshold evolui por sprint. Cobertura real bateu 43% ja na Sprint 2 (test_pricing.py,
# test_shopping.py) - antecipado do cronograma original (Sprint 3=20, Sprint 4=40) para
# refletir o que a suite ja garante, em vez de segurar o gate abaixo do real medido.
# Sprint 2=40, Sprint 5=60, Sprint 6=70, Sprint 7=80
fail_under = 40
