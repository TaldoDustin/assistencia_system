[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "build_exe.ps1",
    "build_setup.ps1",
    "scripts/",
    "assets/",
    "frontend/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line too long — Black handles length
    "UP007",  # use X | Y for union — Python 3.9 compat in some contexts
]

[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
    \.git
  | frontend
  | scripts
  | assets
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = [
    "app",
    "irflow_blueprints_api",
    "fluxoly_blueprints_auth",
    "fluxoly_blueprints_main",
    "fluxoly_core",
    "fluxoly_mercadophone",
    "fluxoly_os",
    "fluxoly_audit",
    "fluxoly_clientes_controller",
    "fluxoly_clientes_service",
    "fluxoly_clientes_repository",
    "fluxoly_unidades_serializadas_controller",
    "fluxoly_unidades_serializadas_service",
    "fluxoly_unidades_serializadas_repository",
    "fluxoly_produtos_controller",
    "fluxoly_produtos_service",
    "fluxoly_produtos_repository",
    "irflow_vendas_service",
    "fluxoly_price_tables",
    "fluxoly_rate_limit",
    "fluxoly_reference_data",
    "fluxoly_reports",
    "fluxoly_storage",
    "fluxoly_validation",
    "fluxoly_web",
]
skip_glob = ["frontend/*", "scripts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-ra",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = [
    "app",
    "irflow_blueprints_api",
    "fluxoly_blueprints_auth",
    "fluxoly_blueprints_main",
    "fluxoly_core",
    "fluxoly_mercadophone",
    "fluxoly_os",
    "fluxoly_audit",
    "fluxoly_clientes_controller",
    "fluxoly_clientes_service",
    "fluxoly_clientes_repository",
    "fluxoly_unidades_serializadas_controller",
    "fluxoly_unidades_serializadas_service",
    "fluxoly_unidades_serializadas_repository",
    "fluxoly_produtos_controller",
    "fluxoly_produtos_service",
    "fluxoly_produtos_repository",
    "irflow_vendas_service",
    "fluxoly_price_tables",
    "fluxoly_rate_limit",
    "fluxoly_reference_data",
    "fluxoly_reports",
    "fluxoly_storage",
    "fluxoly_validation",
    "fluxoly_web",
]
omit = [
    "tests/*",
    "scripts/*",
    "*.ps1",
]

[tool.coverage.report]
show_missing = true
# Threshold evolui por sprint. Cobertura real bateu 43% ja na Sprint 2 (test_pricing.py,
# test_shopping.py) - antecipado do cronograma original (Sprint 3=20, Sprint 4=40) para
# refletir o que a suite ja garante, em vez de segurar o gate abaixo do real medido.
# Elevado para 60 na Sprint CI/CD 1.1 -- Hardening (2026-07-31): cobertura real medida em
# 65.22% (682 testes), deixa ~5 pontos de margem confortavel antes de virar bloqueante de
# verdade. Proximo degrau: 70 (ver docs/operations/PROJECT_STATUS.md).
fail_under = 60
